name = "blessings-img"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"
compatibility_flags = ["nodejs_compat"]

[limits]
cpu_ms = 50000

[vars]
ENVIRONMENT = "production"

[env.production]
vars = { ENVIRONMENT = "production" }

# IMPORTANT: Configure all secrets via Cloudflare Dashboard (Settings > Variables):
# - GEMINI_API_KEY
# - INVITE_CODE
# - OSS_REGION
# - OSS_ACCESS_KEY_ID
# - OSS_ACCESS_KEY_SECRET
# - OSS_BUCKET
# - OSS_ENDPOINT (optional)
# - OSS_PREFIX (optional)
